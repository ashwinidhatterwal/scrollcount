name: Build ScrollCount
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: scrollcount-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Generate public release metadata
        env:
          SUPPORT_EMAIL: ${{ vars.SCROLLCOUNT_SUPPORT_EMAIL }}
        run: |
          if [ -n "$SUPPORT_EMAIL" ]; then python3 tools/configure_release.py --email "$SUPPORT_EMAIL"; fi
          python3 tools/configure_release.py --check
          node tools/render_public_pages.mjs --preview
      - name: Regression checks
        run: |
          bash tests/run.sh
          python3 tests/history_sql_test.py
          python3 tests/privacy_test.py
          python3 tests/automatic_sync_test.py
          python3 tests/hourly_job_test.py
          python3 tests/friend_defaults_test.py
          python3 tests/deploy_termux_test.py
          node backend/test.mjs
          python3 tests/release_metadata_test.py
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScrollCount-Lint-Reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollCount-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Check signing secrets
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEY_B64: ${{ secrets.SCROLLCOUNT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SCROLLCOUNT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCROLLCOUNT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCROLLCOUNT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] && [ -z "$STORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Debug APK ready. Add the four signing secrets to enable signed APK/AAB builds.'
          else
            test -n "$KEY_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Signing setup is incomplete. Add all four SCROLLCOUNT secrets.'; exit 1; }
            umask 077
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/scrollcount-upload.jks"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed Play bundle and APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SCROLLCOUNT_KEYSTORE: ${{ runner.temp }}/scrollcount-upload.jks
          SCROLLCOUNT_STORE_PASSWORD: ${{ secrets.SCROLLCOUNT_STORE_PASSWORD }}
          SCROLLCOUNT_KEY_ALIAS: ${{ secrets.SCROLLCOUNT_KEY_ALIAS }}
          SCROLLCOUNT_KEY_PASSWORD: ${{ secrets.SCROLLCOUNT_KEY_PASSWORD }}
        run: |
          python3 tools/configure_release.py --check --require-complete
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: ScrollCount-Signed-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/scrollcount-upload.jks"
